<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reserva tu hora | prenobooking</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png">
  <style>
    html,body{margin:0;height:100%;background:#EEF5F3;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
    noscript{display:block;padding:32px 20px;text-align:center;color:#334155}
    noscript a{color:#0F766E;font-weight:700}
  </style>
</head>
<body>
<noscript>Para reservar necesitas activar JavaScript. También puedes escribirnos a <a href="mailto:soporte@prenobooking.cl">soporte@prenobooking.cl</a>.</noscript>
<script>
  // Esta página enmarca la reserva real (que vive en el Apps Script de prenobooking, igual que el panel en /admin y el registro).
  // Recibe los enlaces que ya circulan: ?sp=<especialista> y el regreso del pago (?action=check&reservaId=...).
  // Reenvía solo esos tres parámetros y solo si tienen la forma esperada: nada más pasa.
  (function () {
    var BASE_APP_URL = "https://script.google.com/macros/s/AKfycbyp-OnqB-PbDHUm3BFh0kzO8wcN6vhvcAfNRmUaJa5Fb-mYHR6t4c1rA061mxlM8GfN/exec";
    var q = new URLSearchParams(window.location.search);
    var sp = q.get("sp") || "", accion = q.get("action") || "", reservaId = q.get("reservaId") || "";
    var partes = ["view=index"];
    if (/^[A-Za-z0-9_.@-]{3,120}$/.test(sp)) partes.push("sp=" + encodeURIComponent(sp));
    if (accion === "check" && /^[A-Za-z0-9_-]{6,80}$/.test(reservaId)) {
      partes.push("action=check");
      partes.push("reservaId=" + encodeURIComponent(reservaId));
    }
    var f = document.createElement("iframe");
    f.src = BASE_APP_URL + "?" + partes.join("&");
    f.title = "Reserva tu hora en prenobooking";
    f.setAttribute("allow", "payment");
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
