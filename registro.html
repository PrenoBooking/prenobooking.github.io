<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crea tu cuenta | prenobooking</title>
  <meta name="description" content="Solicita tu cuenta en prenobooking: agenda, cobros y seguimiento de tus pacientes en un solo lugar.">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png">
  <style>
    html,body{margin:0;height:100%;background:#F0F7F6;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
    noscript{display:block;padding:32px 20px;text-align:center;color:#334155}
    noscript a{color:#0F766E;font-weight:700}
  </style>
</head>
<body>
<noscript>Para crear tu cuenta necesitas activar JavaScript. También puedes escribirnos a <a href="mailto:soporte@prenobooking.cl">soporte@prenobooking.cl</a>.</noscript>
<script>
  // Esta página solo enmarca el formulario real (que vive en el Apps Script de prenobooking, igual que el panel en /admin).
  // Reenvía únicamente lo que el formulario espera: nada más pasa. Los valores se verifican antes de usarse.
  (function () {
    var BASE_APP_URL = "https://script.google.com/macros/s/AKfycbyp-OnqB-PbDHUm3BFh0kzO8wcN6vhvcAfNRmUaJa5Fb-mYHR6t4c1rA061mxlM8GfN/exec";
    var q = new URLSearchParams(window.location.search);
    var sid = q.get("sid") || "", verificar = q.get("verificar") || "", plan = q.get("plan") || "";
    var partes = ["view=registro"];
    if (/^sol-\d{10,15}-[a-f0-9]{6}$/.test(sid)) partes.push("sid=" + encodeURIComponent(sid));
    if (/^[a-f0-9]{32,80}$/.test(verificar)) partes.push("verificar=" + encodeURIComponent(verificar));
    if (plan === "esencial" || plan === "profesional") partes.push("plan=" + plan);
    var f = document.createElement("iframe");
    f.src = BASE_APP_URL + "?" + partes.join("&");
    f.title = "Formulario de registro de prenobooking";
    f.setAttribute("referrerpolicy", "no-referrer");
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
