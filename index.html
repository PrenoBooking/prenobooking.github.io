<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>PrenoBooking</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Reserva y confirmación de citas de psicoterapia – prenobooking." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Agenda aquí" />
  <meta property="og:description" content="Reserva y confirmación de citas de psicoterapia." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --header-h: 72px;
      --page-bg: #F0F7F6;
      --header-bg: #ffffff;
      --border: rgba(0,0,0,.06);
      --brand: #0D9488;
      --accent: #B4F461;
      --text-main: #0F172A;
      --text-soft: rgba(0,0,0,.55);
    }

    html, body{
      height: 100%;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .wrap{
      height: 100vh; /* Respaldo para navegadores embebidos (WhatsApp, Instagram) sin soporte de svh */
      height: 100svh;
      position: relative;
    }

    header{
      height: var(--header-h);
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
    }

    .brand-lockup{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-lockup span{
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: var(--text-main);
    }

    .brand-lockup span em{
      font-style: normal;
      font-weight: 500;
      color: var(--brand);
    }

    .frame-area{
      position: absolute;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--page-bg);
    }

    iframe{
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .loader{
      position:absolute;
      inset: 0;
      display:grid;
      place-items:center;
      background: rgba(245,245,250,.85);
      transition: opacity .25s ease;
      z-index: 2;
    }

    .loader.hidden{
      opacity: 0;
      pointer-events:none;
    }

    .spinner{
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid rgba(13,148,136,.15);
      border-top-color: var(--brand);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fallback{
      position:absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display:none;
      gap: 14px;
      align-items:center;
      padding: 14px 20px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-soft);
      box-shadow: 0 20px 40px rgba(0,0,0,.06);
      z-index: 3;
    }

    .fallback.show{
      display:flex;
    }

    .btn{
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration:none;
      font-weight: 600;
      font-size: 14px;
      color: white;
      background: var(--brand);
      transition: opacity .2s ease;
    }

    .btn:hover{
      opacity: .9;
    }

    @media (max-width: 520px){
      :root{ --header-h: 64px; }
      .fallback{ flex-direction: column; text-align: center; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <!-- 🔒 El logo ya no depende de un archivo externo (logo.png) — es SVG
           inline, así nunca falla la carga ni queda desalineado con la
           tipografía de marca (Space Grotesk). -->
      <div class="brand-lockup">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="#0D9488"/>
          <rect x="18" y="20" width="28" height="26" rx="6" fill="#ffffff"/>
          <rect x="22.5" y="24.5" width="19" height="17" rx="3" fill="#0D9488"/>
          <rect x="23" y="13" width="5" height="12" rx="2.5" fill="#ffffff"/>
          <rect x="36" y="13" width="5" height="12" rx="2.5" fill="#ffffff"/>
          <circle cx="32" cy="34" r="4.5" fill="#B4F461"/>
        </svg>
        <span>preno<em>booking</em></span>
      </div>
    </header>

    <div class="frame-area">
      <div id="loader" class="loader">
        <div class="spinner"></div>
      </div>

      <!-- El iframe ya no tiene el "src" escrito fijo, se lo pasaremos con Javascript -->
      <iframe
        id="bk-frame"
        title="Formulario de Reserva"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <div id="fb" class="fallback">
        <span>No se pudo cargar aquí.</span>
        <a class="btn" id="btn-fallback" target="_top" rel="noopener noreferrer">
            Abrir directamente
        </a>
      </div>
    </div>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const fb     = document.getElementById('fb');
    const frame  = document.getElementById('bk-frame');
    const btnFb  = document.getElementById('btn-fallback');

    // 1. URL Base de tu Apps Script
    const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp-OnqB-PbDHUm3BFh0kzO8wcN6vhvcAfNRmUaJa5Fb-mYHR6t4c1rA061mxlM8GfN/exec";
    
    // 2. Extraer parámetros de la URL en la que está el paciente (Ej: ?sp=vicente@tudominio.cl)
    const urlParams = window.location.search; 

    // 3. Crear la URL final uniendo ambas partes
    const finalUrl = BASE_SCRIPT_URL + urlParams;

    // 🔒 FIX: usamos un formulario oculto en vez de window.location.href para
    // navegar. Asignar location.href directo a una URL de script.google.com
    // puede ser interceptado por los "Universal Links" de iOS, que intentan
    // abrirlo con la app de Google Drive en vez de en el navegador — y como
    // no es un archivo real de Drive, falla. El envío de un formulario no se
    // ve afectado por esta interceptación.
    function irADireccion(url) {
      const form = document.createElement('form');
      form.method = 'GET';
      form.action = url;
      form.target = '_top';
      document.body.appendChild(form);
      form.submit();
    }

    if (frame) frame.src = finalUrl;
    if (btnFb) btnFb.href = finalUrl;

    const hideLoader = () => loader.classList.add('hidden');

    const goDirect = () => irADireccion(finalUrl);

    if (frame) {
      frame.addEventListener('load', hideLoader);
      frame.addEventListener('error', () => {
        fb.classList.add('show');
        hideLoader();
        goDirect();
      });
    }

    setTimeout(() => {
      if (!loader.classList.contains('hidden')) {
        fb.classList.add('show');
        hideLoader();
        goDirect();
      }
    }, 6000);
  </script>
  <!-- CÓDIGO PARA AÑADIR EN GITHUB -->
<script>
  window.addEventListener("message", function(event) {
    // Escuchamos si el iframe de Google nos manda la señal de cierre de sesión
    if (event.data === "accion_logout") {
      
      // Limpiamos la memoria local de GitHub por precaución
      sessionStorage.clear();
      localStorage.clear();
      
      // Forzamos a la página principal a recargarse limpia, sin memoria.
      // Esto devolverá al usuario a la vista de Login automáticamente.
      window.location.href = window.location.pathname; 
    }
  });
</script>
</body>
</html>
