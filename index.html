<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>prenobooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Reserva y confirmación de citas de psicoterapia – prenobooking." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Agenda aquí" />
  <meta property="og:description" content="Reserva y confirmación de citas de psicoterapia." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://raw.githubusercontent.com/vicentemoyanoas-boop/booking-preno-assets/main/favicon.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --header-h: 72px;
      --page-bg: #F0F7F6;
      --header-bg: #ffffff;
      --border: rgba(0,0,0,.06);
      --brand: #0D9488;
      --accent: #B4F461;
      --text-main: #0F172A;
      --text-soft: rgba(0,0,0,.55);
    }

    html, body{
      height: 100%;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }

    .wrap{
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
    }

    header{
      height: var(--header-h);
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }

    .brand-lockup{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-lockup span{
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: var(--text-main);
    }

    .brand-lockup span em{
      font-style: normal;
      font-weight: 500;
      color: var(--brand);
    }

    .frame-area{
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--page-bg);
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }

    iframe{
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .loader{
      position:absolute;
      inset: 0;
      display:grid;
      place-items:center;
      background: rgba(245,245,250,.85);
      transition: opacity .25s ease;
      z-index: 2;
    }

    .loader.hidden{
      opacity: 0;
      pointer-events:none;
    }

    .spinner{
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid rgba(13,148,136,.15);
      border-top-color: var(--brand);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fallback{
      position:absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      transform: none;
      display:none;
      flex-direction: column;
      gap: 14px;
      align-items:center;
      padding: 16px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-soft);
      box-shadow: 0 12px 30px rgba(0,0,0,.08);
      z-index: 3;
    }

    @media (min-width: 520px) {
      .fallback {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        flex-direction: row;
        border-radius: 14px;
        padding: 14px 20px;
      }
    }

    .fallback.show{
      display:flex;
    }

    .btn{
      width: 100%;
      text-align: center;
      padding: 12px 18px;
      box-sizing: border-box;
      border-radius: 12px;
      text-decoration:none;
      font-weight: 600;
      font-size: 14px;
      color: white;
      background: var(--brand);
      transition: opacity .2s ease;
    }

    @media (min-width: 520px) {
      .btn {
        width: auto;
        padding: 10px 16px;
        border-radius: 10px;
      }
    }

    .btn:hover{
      opacity: .9;
    }

    @media (max-width: 520px) {
      :root{ --header-h: 60px; }
      .fallback{ text-align: center; }
      .brand-lockup span { font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand-lockup">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="#0D9488"/>
          <rect x="18" y="20" width="28" height="26" rx="6" fill="#ffffff"/>
          <rect x="22.5" y="24.5" width="19" height="17" rx="3" fill="#0D9488"/>
          <rect x="23" y="13" width="5" height="12" rx="2.5" fill="#ffffff"/>
          <rect x="36" y="13" width="5" height="12" rx="2.5" fill="#ffffff"/>
          <circle cx="32" cy="34" r="4.5" fill="#B4F461"/>
        </svg>
        <span>preno<em>booking</em></span>
      </div>
    </header>

    <div class="frame-area">
      <div id="loader" class="loader">
        <div class="spinner"></div>
      </div>

      <iframe
        id="bk-frame"
        title="Formulario de Reserva"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <div id="fb" class="fallback">
        <span>No se pudo cargar de forma integrada.</span>
        <a class="btn" id="btn-fallback" target="_top" rel="noopener noreferrer">
            Abrir directamente
        </a>
      </div>
    </div>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const fb     = document.getElementById('fb');
    const frame  = document.getElementById('bk-frame');
    const btnFb  = document.getElementById('btn-fallback');

    const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp-OnqB-PbDHUm3BFh0kzO8wcN6vhvcAfNRmUaJa5Fb-mYHR6t4c1rA061mxlM8GfN/exec";
    const urlParams = window.location.search; 
    const finalUrl = BASE_SCRIPT_URL + urlParams;

    if (frame) frame.src = finalUrl;
    if (btnFb) btnFb.href = finalUrl;

    const hideLoader = () => loader.classList.add('hidden');

    const goDirect = () => {
      try { window.top.location.href = finalUrl; }
      catch { window.location.href = finalUrl; }
    };

    if (frame) {
      frame.addEventListener('load', hideLoader);
      frame.addEventListener('error', () => {
        fb.classList.add('show');
        hideLoader();
        goDirect();
      });
    }

    setTimeout(() => {
      if (!loader.classList.contains('hidden')) {
        fb.classList.add('show');
        hideLoader();
        goDirect();
      }
    }, 6000);
  </script>
  
  <script>
    window.addEventListener("message", function(event) {
      if (event.data === "accion_logout") {
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = window.location.pathname; 
      }
    });
  </script>
</body>
</html>
